  mixture:
    epoch_size: 200000
    seed: 42
  lazy_load: true
  num_workers: 8
  prefetch_factor: 8
  video_tolerance_s: 0.1
  parquet_cache_size: 1
  sampling_mode: multi_anchor
  multi_anchor_macro_stride: 48
  multi_anchor_video_offsets:
  - 0
  - 6
  - 12
  - 18
  - 24
  - 30
  - 36
  - 42
  video_backend: torchcodec
  return_episode_first_images: false
  dataloader_profile: true
  dataloader_profile_first_n: 4
  dataloader_profile_slow_s: 2.0
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 512
  seed: 42
  enable_offload: false
  model:
    model_type: dreamzero
    precision: fp32
    model_path: null
    checkpoint_config_mode: yaml_only
    tokenizer_path: null
    diffusion_model_pretrained_path: null
    image_encoder_pretrained_path: null
    text_encoder_pretrained_path: null
    vae_pretrained_path: null
    metadata_json_path: .assets/agibot_world_alpha_metadata.json
    action_horizon: 48
    state_horizon: 1
    num_action_per_block: 48
    action_dim: 16
    max_action_dim: 16
    max_state_dim: 16
    image_resolution_width: 160
    image_resolution_height: 128
    target_video_width: 320
    target_video_height: 256
    action_head_cfg:
      config:
        action_dim: 16
        max_action_dim: 16
        max_state_dim: 16
        diffusion_model_cfg:
          action_architecture: full
          action_condition_on_text: false
          action_hidden_size: 1024
          action_ffn_dim: 4096
          action_dim: 16
          max_state_dim: 16
          frame_seqlen: 80
          enable_missing_action_embedding: true
        train_architecture: full
        video_condition_on_action_state: false
        use_past_action_context: false
        use_episode_first_frame_token: false
    is_lora: false
    embodiment_tag: noe_robotics_16d
    metadata_embodiment_tag: noe_robotics_16d
    embodiment_tag_mapping:
      noe_robotics_16d: 39
      egopro: 39
    relative_action: false
    relative_action_mode: null
    relative_action_keys: []
    relative_action_per_horizon: false
    load_to_device: false
  optim:
    lr: 4.0e-05
    value_lr: 0.000155
    adam_beta1: 0.95
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 1.0e-05
    clip_grad: 1.0
    lr_scheduler: constant
    lr_warmup_steps: -1
    lr_warmup_steps_ratio: 0.05
    total_training_steps: ${runner.max_steps}
  fsdp_config:
    strategy: fsdp2
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: true
    limit_all_gathers: true
    forward_prefetch: true
    backward_prefetch: pre
    reshard_after_forward: true
    save_full_model_weights: false
    grad_scaler:
      enabled: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: bf16
