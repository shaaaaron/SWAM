# Robotics pretraining with AdamW on 21 dataset parts.
# Sampling weights are proportional to effective duration after exclusions.
# ABC train/val use video-only supervision.
defaults:
- training_backend/fsdp@actor.fsdp_config
- model/dreamzero_5b_wo_img@actor.model
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://robotwin/config/
cluster:
  num_nodes: 1
  component_placement:
    actor: all
runner:
  task_type: sft
  logger:
    log_path: null
    project_name: dreamzero_robotwin_wan2_2
    experiment_name: pretrain
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 5000
  save_start_step: 19000
  log_interval: 10
  resume_dir: null
data:
  train_data_paths: place_holder
  prompt_style: robotics
  train_datasets:
  - name: agibot_world_alpha
    prompt_postfix: "The robot model is AgiBot A2D."
    weight: 0.053524324622213626  # 526.46 / 9835.97 ~= 0.0535 (5.35%).
    data_paths: ../data/robotics/agibot-world-alpha
    metadata_json_path: .assets/agibot_world_alpha_metadata.json
    embodiment_tag: noe_robotics_16d
    metadata_embodiment_tag: noe_robotics_16d
    subtask_mode: unified_dense
    subtask_file: meta/subtask/episode_all_qwen.parquet
    caption_granularity: episode
    subtask_caption_field: action_detail_en
    subtask_caption_extra: scene_light
    has_real_action: true
    relative_action: false
    relative_action_mode: ''
    relative_action_keys: []
    image_resolution_width: 160
    image_resolution_height: 128
