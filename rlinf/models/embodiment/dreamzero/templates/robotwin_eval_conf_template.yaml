model:
  _target_: groot.vla.model.dreamzero.base_vla.VLA
  _convert_: object
  config:
    _target_: groot.vla.model.dreamzero.base_vla.VLAConfig
    _recursive_: false
    model_type: vla
    architectures:
      - VLA
    model_dtype: float32
    action_head_cfg:
      config:
        model_dtype: float32
        skip_component_loading: true
        defer_lora_injection: false

transforms:
  robotwin:
    _target_: groot.vla.data.transform.ComposedModalityTransform
    transforms:
      - _target_: groot.vla.data.transform.VideoToTensor
        apply_to:
          - video.cam_left_wrist
          - video.cam_right_wrist
          - video.cam_high
      - _target_: groot.vla.data.transform.VideoCrop
        apply_to:
          - video.cam_left_wrist
          - video.cam_right_wrist
          - video.cam_high
        scale: 0.95
        mode: random
      - _target_: groot.vla.data.transform.VideoResize
        apply_to:
          - video.cam_left_wrist
          - video.cam_right_wrist
          - video.cam_high
        height: 128
        width: 160
        interpolation: linear
      - _target_: groot.vla.data.transform.VideoColorJitter
        apply_to:
          - video.cam_left_wrist
          - video.cam_right_wrist
          - video.cam_high
        brightness: 0.3
        contrast: 0.4
        saturation: 0.5
        hue: 0.08
      - _target_: groot.vla.data.transform.VideoToNumpy
        apply_to:
          - video.cam_left_wrist
          - video.cam_right_wrist
          - video.cam_high
      - _target_: groot.vla.data.transform.StateActionToTensor
        apply_to:
          - state.eef_position
      - _target_: groot.vla.data.transform.StateActionTransform
        apply_to:
          - state.eef_position
        normalization_modes:
          state.eef_position: q99
      - _target_: groot.vla.data.transform.StateActionToTensor
        apply_to:
          - action.eef_position
      - _target_: groot.vla.data.transform.StateActionTransform
        apply_to:
          - action.eef_position
        normalization_modes:
          action.eef_position: q99
      - _target_: groot.vla.data.transform.ConcatTransform
        video_concat_order:
          - video.cam_left_wrist
          - video.cam_right_wrist
          - video.cam_high
        state_concat_order:
          - state.eef_position
        action_concat_order:
          - action.eef_position
      - _target_: groot.vla.model.dreamzero.transform.dreamzero_cotrain.DreamTransform
        default_instruction: Perform the default behavior.
        language_dropout_prob: 0.0
        always_use_default_instruction: false
        max_state_dim: 16
        max_action_dim: 16
        max_length: 512
        state_horizon: 1
        action_horizon: 48
        embodiment_tag_mapping:
          robotwin: 33
        tokenizer_path: ${model.config.tokenizer_path}

eval_bf16: true
save_lora_only: false
relative_action: false
relative_action_per_horizon: false
relative_action_keys: []

