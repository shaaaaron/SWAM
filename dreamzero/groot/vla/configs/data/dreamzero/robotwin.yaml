# @package _global_

defaults:
  - dreamzero/base_48_wan_fine_aug_relative
  - _self_ # this file will override the base

max_state_dim: 16
max_action_dim: 16
use_global_metadata: false
relative_action: false
max_chunk_size: 4
# Use 50% of data in shards before moving to next shard
dataset_shard_sampling_rate: 0.5
mixture_dataset_cls: groot.vla.data.dataset.lerobot_sharded.ShardedLeRobotMixtureDataset.from_mixture_spec
single_dataset_cls: groot.vla.data.dataset.lerobot_sharded.ShardedLeRobotSubLangSingleActionChunkDatasetRoboTwin

# Set your RoboTwin dataset root here or override via CLI:
#   robotwin_data_root=/path/to/robotwin-clean-and-aug-lerobot
# The training script will auto-discover all task folders and pass them as a
# list via CLI override: 'robotwin_task_paths=[path1,path2,...]'
robotwin_task_paths: ???

train_dataset:
  _target_: ${mixture_dataset_cls}
  _convert_: object
  mixture_spec:
    - dataset_path:
        robotwin: ${robotwin_task_paths}
      dataset_weight: 1.0
      distribute_weights: true

  dataset_class: ${single_dataset_cls}
  all_modality_configs: ${modality_configs}
  all_transforms: ${transforms}
  metadata_versions: ${metadata_versions}
  fps: ${fps}
  dataset_kwargs:
    video_backend: decord
    use_global_metadata: ${use_global_metadata}
    max_chunk_size: ${max_chunk_size}
    relative_action: ${relative_action}
  mixture_kwargs:
    training: true
    balance_dataset_weights: false
    seed: 42
    shard_sampling_rate: ${dataset_shard_sampling_rate}
